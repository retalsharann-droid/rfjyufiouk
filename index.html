<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>موسم الخير | اختبار قطف الزيتون</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700;800&display=swap">
<style>
:root{--bg:#f7f2e6;--surface:#fffdf8;--text:#243024;--muted:#667058;--line:#e6dfc8;--green:#4f6b34;--deep:#1f3322;--leaf:#9fb36a;--gold:#c8a458;--goldsoft:#f3e8c6;--ok:#e8f3dd;--okline:#6f9a4e;--bad:#fbebe4;--badline:#c9795f;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141b14;--surface:#1c261c;--text:#ecefe3;--muted:#a4ae94;--line:#314031;--goldsoft:#3a3520;--ok:#22351f;--bad:#3a231d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141b14;--surface:#1c261c;--text:#ecefe3;--muted:#a4ae94;--line:#314031;--goldsoft:#3a3520;--ok:#22351f;--bad:#3a231d;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Cairo',Tahoma,sans-serif;line-height:1.9}
.hero{position:relative;z-index:1;overflow:hidden;color:#fbf6e6;text-align:center;padding:26px 20px 110px;background:radial-gradient(circle at 15% 10%,#3f5c36 0,transparent 45%),radial-gradient(circle at 90% 80%,#6b7f3e55 0,transparent 40%),linear-gradient(135deg,#1c3020,#35502e 60%,#4f6b34)}
.hero:before,.hero:after{content:'❦';position:absolute;font-size:230px;color:#e8d9a4;opacity:.08;line-height:1;pointer-events:none}
.hero:before{right:-30px;top:-40px;transform:rotate(-20deg)}.hero:after{left:-40px;bottom:-60px;transform:rotate(150deg)}
.bar{display:flex;justify-content:space-between;align-items:center;max-width:1000px;margin:0 auto;position:relative;z-index:1}
.brand{display:flex;align-items:center;gap:12px;text-align:right}
.logo{width:58px;height:58px;border-radius:50%;border:1.5px solid var(--gold);background:#fff;display:block;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover}
.brand b{font-family:'Amiri',serif;font-size:24px;display:block;line-height:1.2;color:#f1deaa}.brand small{font-size:12px;color:#d9e2c4;letter-spacing:.5px}
.chip{border:1px solid #d8c68a88;background:#ffffff12;color:#f6ecc9;border-radius:30px;padding:6px 16px;font:600 13px 'Cairo',sans-serif;cursor:pointer}
.hero-body{position:relative;z-index:1;max-width:720px;margin:28px auto 0}
.biglogo{width:clamp(150px,30vw,210px);height:clamp(150px,30vw,210px);border-radius:50%;object-fit:cover;border:3px solid var(--gold);box-shadow:0 0 0 8px #ffffff14,0 18px 40px #0006;margin-bottom:18px}
.badge{display:inline-block;padding:3px 18px;border:1px solid #d8c68a88;border-radius:30px;font-size:13px;color:#ecdfb0;letter-spacing:1px}
h1{font-family:'Amiri',serif;font-size:clamp(34px,6vw,62px);line-height:1.35;margin:14px 0 8px;font-weight:700}
h1 em{font-style:normal;background:linear-gradient(90deg,#f1deaa,#c8a458);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:0 auto;max-width:560px;color:#e2e8d2}
.orn{margin-top:16px;color:var(--gold);letter-spacing:10px}
main{max-width:760px;margin:-70px auto 0;padding:0 18px 50px;position:relative;z-index:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:26px;box-shadow:0 24px 60px #1c2d1a22;padding:28px;position:relative}
.card:before{content:'';position:absolute;inset:7px;border:1px solid var(--goldsoft);border-radius:20px;pointer-events:none}
.top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:6px;position:relative}
.step{font-weight:700;color:var(--green);font-size:14px}.step b{font-size:22px;font-family:'Amiri',serif;color:var(--gold)}
.ring{width:54px;height:54px;transform:rotate(90deg) scaleX(-1)}.ring circle{fill:none;stroke-width:5}.ring .t{stroke:var(--line)}.ring .p{stroke:var(--gold);stroke-linecap:round;transition:stroke-dashoffset .5s}
.track{display:flex;gap:5px;margin:8px 0 22px;position:relative}.track i{flex:1;height:5px;border-radius:5px;background:var(--line);transition:.3s}.track i.on{background:linear-gradient(90deg,var(--leaf),var(--gold))}
.q{font-family:'Amiri',serif;font-size:clamp(21px,3.6vw,27px);line-height:1.85;font-weight:700;margin:0 0 20px;color:var(--text);position:relative}
.opts{display:grid;gap:11px;position:relative}
.opt{display:flex;align-items:center;gap:13px;text-align:right;width:100%;border:1.5px solid var(--line);background:var(--bg);color:var(--text);border-radius:16px;padding:13px 16px;font:600 15px/1.7 'Cairo',sans-serif;cursor:pointer;transition:.18s}
.opt:hover:not(:disabled){border-color:var(--leaf);transform:translateX(-4px)}
.opt .k{flex:0 0 34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--goldsoft);color:var(--green);font-weight:800;font-size:14px}
.opt.ok{border-color:var(--okline);background:var(--ok)}.opt.ok .k{background:var(--okline);color:#fff}
.opt.no{border-color:var(--badline);background:var(--bad)}.opt.no .k{background:var(--badline);color:#fff}
.opt:disabled{cursor:default}
.fb{display:none;margin-top:16px;padding:13px 16px;border-radius:14px;font-size:14px;border-right:4px solid var(--okline);background:var(--ok)}
.fb.show{display:block;animation:up .3s}.fb.bad{border-color:var(--badline);background:var(--bad)}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:22px;position:relative}
.btn{border:0;border-radius:30px;padding:12px 30px;font:700 15px 'Cairo',sans-serif;cursor:pointer;transition:.18s}
.btn.main{background:linear-gradient(135deg,#4f6b34,#6d8a44);color:#fff;box-shadow:0 8px 20px #4f6b3440}.btn.main:disabled{opacity:.4;box-shadow:none;cursor:default}
.btn.ghost{background:transparent;border:1.5px solid var(--gold);color:var(--text)}
.score{text-align:center;position:relative}
.medal{width:120px;height:120px;margin:0 auto 10px;border-radius:50%;display:grid;place-items:center;font-size:46px;background:radial-gradient(circle,#f6e9b8,#c8a458);color:#3b3016;box-shadow:0 0 0 7px var(--goldsoft),0 14px 30px #c8a45855}
.score h2{font-family:'Amiri',serif;font-size:34px;margin:6px 0 0}.score .n{font-size:44px;font-weight:800;color:var(--green)}
.rev{margin:18px 0 0;text-align:right;display:grid;gap:8px}
.rev div{padding:10px 14px;border-radius:12px;background:var(--bg);border:1px solid var(--line);font-size:14px}.rev b{color:var(--green)}
.foot{text-align:center;color:var(--muted);font-size:13px;padding:10px 0 30px}
.bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.35;animation:orb 20s ease-in-out infinite alternate}
.orb.a{width:380px;height:380px;background:#b9cc84;top:8%;right:-8%}
.orb.b{width:340px;height:340px;background:#e6cf8a;bottom:5%;left:-8%;animation-duration:26s}
.orb.c{width:260px;height:260px;background:#9fb36a;top:48%;left:35%;animation-duration:32s;opacity:.22}
@keyframes orb{from{transform:translate(0,0) scale(1)}to{transform:translate(-70px,60px) scale(1.2)}}
.lf{position:absolute;bottom:-60px;color:var(--leaf);opacity:0;animation:float linear infinite}
@keyframes float{0%{transform:translate(0,0) rotate(0);opacity:0}10%{opacity:.5}90%{opacity:.4}100%{transform:translate(var(--dx),-115vh) rotate(var(--rot));opacity:0}}
.hero:before{animation:sway 18s ease-in-out infinite alternate}.hero:after{animation:sway2 22s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-20deg)}to{transform:rotate(-2deg) translate(20px,15px)}}
@keyframes sway2{from{transform:rotate(150deg)}to{transform:rotate(172deg) translate(-15px,-10px)}}
.biglogo{animation:glow 5s ease-in-out infinite alternate}
@keyframes glow{from{box-shadow:0 0 0 8px #ffffff14,0 18px 40px #0006}to{box-shadow:0 0 0 14px #c8a45833,0 18px 55px #c8a45855}}
@media(prefers-reduced-motion:reduce){.orb,.lf,.hero:before,.hero:after,.biglogo{animation:none}}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.fade{animation:up .35s}
@media(max-width:560px){.card{padding:20px 16px}.hero{padding-bottom:100px}.brand b{font-size:20px}}
</style>
</head>

    <h1>اختبار <em>موسم قطف الزيتون</em></h1>
    <p>عشرة أسئلة مختارة بعناية، من الأرض إلى المعصرة. اختاري إجابتك وتعلّمي من كل توضيح.</p>
    <div class="orn">❦ ❦ ❦</div>
  </div>
</header>
<main>
  <section class="card" id="card"></section>
  <div class="foot">صُمّم بعناية للأرض والتراث · كل حبة زيتون حكاية ❦</div>
</main>
<script>
const Q=[
{q:'ما السبب الزراعي الأهم لاختيار موعد القطف بعناية؟',a:['نضج الثمار يؤثر في كمية الزيت ونوعيته','لون أوراق الشجرة يتغير في يوم محدد','المعاصر تعمل في يوم واحد فقط','المطر يمنع نمو الجذور طوال العام'],c:0,e:'درجة النضج وموعد القطف يؤثران في كمية الزيت وطعمه وصفاته.'},
{q:'أي ممارسة تحافظ على جودة الزيتون بعد قطفه؟',a:['تركه في أكياس مغلقة لأيام','خلط السليم بالمتعفن','نقله إلى المعصرة دون تأخير وتجنب تكديسه','تعريضه للشمس الحارقة طوال اليوم'],c:2,e:'التأخير والتكديس يسرّعان تلف الثمار ويضعفان جودة الزيت.'},
{q:'لماذا يُعد ضرب أغصان الزيتون بعنف بالعصي ممارسة غير مفضلة؟',a:['يجعل الثمار أكبر حجما','قد يجرح الأغصان ويضر براعم الموسم القادم','يمنع النضج في الموسم نفسه فقط','يغيّر نوع التربة مباشرة'],c:1,e:'إيذاء الأغصان والبراعم يقلل نمو الشجرة وإنتاجها لاحقا.'},
{q:'ما المقصود بفرز الزيتون بعد القطف؟',a:['إزالة الأوراق والشوائب وفصل الثمار التالفة','إضافة الماء ليزداد الوزن','تجفيف الثمار حتى تصلب','خلطه بالتراب لتغيير لونه'],c:0,e:'الفرز والتنظيف يقللان الشوائب ويحافظان على جودة المحصول.'},
{q:'أي عامل يؤثر في كمية المحصول من سنة لأخرى؟',a:['شكل السلال فقط','لون ملابس القطافين','تناوب الحمل والطقس والعناية بالشجرة','عدد الصور الملتقطة في البستان'],c:2,e:'يتفاوت حمل الشجرة بين المواسم، وتؤثر فيه الظروف الجوية والرعاية الزراعية.'},
{q:'ما فائدة عصر الزيتون خلال فترة مناسبة بعد القطف؟',a:['تقليل تدهور الثمار والحفاظ على خصائص الزيت','جعل الزيت لا يتأثر بالحرارة أبدا','ضمان أن تعطي كل الثمار الكمية نفسها','إلغاء الحاجة إلى التنظيف'],c:0,e:'التعامل السريع والسليم مع الثمار يحد من تراجع الجودة.'},
{q:'أي وصف يوضح أهمية موسم الزيتون الاجتماعية في الأردن؟',a:['نشاط فردي لا علاقة له بالعائلة','يعزز تعاون العائلة والمجتمع ويحفظ التقاليد','يقتصر على بيع الأدوات الزراعية','يحدث داخل المعاصر فقط'],c:1,e:'يجمع الموسم العائلة والجيران وينقل الخبرات والتقاليد بين الأجيال.'},
{q:'لماذا تُعد شجرة الزيتون رمزا ثقافيا مهما للأردنيين؟',a:['لأنها لا تحتاج إلى ماء أو عناية','لأنها لا تنمو إلا قرب المدن','لارتباطها بالأرض والذاكرة والتراث عبر الأجيال','لأن ثمارها للزينة فقط'],c:2,e:'ارتبطت الشجرة بالأرض والتراث وذاكرة العائلات الأردنية عبر الأجيال.'},
{q:'ما التصرف الأفضل عند جمع الثمار من شجرة مرتفعة؟',a:['التسلق بطريقة غير آمنة','الوقوف تحت أغصان تتحرك بعنف','استخدام وسيلة وصول آمنة وأدوات مناسبة مع حماية العينين واليدين','سحب الأغصان بقوة مهما كان سمكها'],c:2,e:'السلامة أولا: وسائل مناسبة، وتجنب التسلق أو السحب العنيف.'},
{q:'ما الخطة الأفضل للحصول على زيت جيد مع الحفاظ على الشجرة؟',a:['قطف عنيف وتكديس حتى نهاية الأسبوع','موعد مناسب وقطف لطيف وفرز ونقل سريع','جمع المتعفن مع السليم دون فرز','تأجيل النقل إلى المعصرة مهما كانت الظروف'],c:1,e:'الخطة المتكاملة تجمع توقيت القطف وحماية الشجرة والفرز والنقل السريع.'}
];
const L=['أ','ب','ج','د'],card=document.getElementById('card');
let i=0,score=0,picks=[],done=false;
const C=2*Math.PI*21;
function show(){
  if(i>=Q.length)return result();
  const x=Q[i],pct=i/Q.length;
  card.innerHTML=`<div class="fade">
  <div class="top"><div class="step">السؤال <b>${i+1}</b> من ${Q.length}</div>
  <svg class="ring" viewBox="0 0 54 54"><circle class="t" cx="27" cy="27" r="21"/><circle class="p" cx="27" cy="27" r="21" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct)}"/></svg></div>
  <div class="track">${Q.map((_,k)=>`<i class="${k<i?'on':''}"></i>`).join('')}</div>
  <h2 class="q">${x.q}</h2>
  <div class="opts">${x.a.map((t,j)=>`<button class="opt" data-j="${j}"><span class="k">${L[j]}</span><span>${t}</span></button>`).join('')}</div>
  <div class="fb" id="fb"></div>
  <div class="nav"><button class="btn ghost" id="restart">البدء من جديد</button><button class="btn main" id="next" disabled>${i==Q.length-1?'عرض النتيجة':'السؤال التالي'}</button></div></div>`;
  card.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.j));
  document.getElementById('restart').onclick=reset;
  document.getElementById('next').onclick=()=>{i++;show();window.scrollTo({top:0,behavior:'smooth'})};
}
function pick(j){
  const x=Q[i],ok=j===x.c;picks[i]=j;if(ok)score++;
  card.querySelectorAll('.opt').forEach((b,k)=>{b.disabled=true;if(k===x.c)b.classList.add('ok');else if(k===j)b.classList.add('no')});
  const f=document.getElementById('fb');f.className='fb show'+(ok?'':' bad');
  f.innerHTML=(ok?'<b>إجابة صحيحة! </b>':'<b>الإجابة الصحيحة: '+x.a[x.c]+'. </b>')+x.e;
  document.getElementById('next').disabled=false;
}
function result(){
  const t=score>=9?['رائع جدا!','🏆']:score>=7?['أحسنتِ!','🥇']:score>=5?['بداية جيدة','🌿']:['واصلي التعلّم','🫒'];
  card.innerHTML=`<div class="score fade"><div class="medal">${t[1]}</div><h2>${t[0]}</h2>
  <div class="n">${score} / ${Q.length}</div>
  <p>${score>=7?'لديكِ معرفة ممتازة بموسم الزيتون في الأردن.':'راجعي الأسئلة أدناه لتتعرّفي أكثر على موسم الزيتون في الأردن.'}</p>
  <div class="rev">${Q.map((x,k)=>`<div>${k+1}. ${picks[k]===x.c?'✅':'❌'} <b>${x.a[x.c]}</b></div>`).join('')}</div>
  <div class="nav" style="justify-content:center;gap:12px"><button class="btn main" id="again">إعادة الاختبار</button><button class="btn ghost" onclick="window.print()">طباعة النتيجة</button></div></div>`;
  document.getElementById('again').onclick=reset;
}
function reset(){i=0;score=0;picks=[];show()}
const tb=document.getElementById('theme');
tb.onclick=()=>{const d=document.documentElement,dark=getComputedStyle(d).colorScheme==='dark';d.dataset.theme=dark?'light':'dark';tb.textContent=dark?'☾ الوضع الليلي':'☀ الوضع النهاري'};
(function(){const bg=document.getElementById('bg'),G=['❦','🍃','🫒','❧','🌿'];for(let n=0;n<22;n++){const s=document.createElement('span');s.className='lf';s.textContent=G[n%G.length];s.style.left=(Math.random()*100)+'%';s.style.fontSize=(18+Math.random()*30)+'px';s.style.animationDuration=(16+Math.random()*20)+'s';s.style.animationDelay=(-Math.random()*30)+'s';s.style.setProperty('--dx',(Math.random()*160-80)+'px');s.style.setProperty('--rot',(Math.random()*500-250)+'deg');bg.appendChild(s)}})();
show();
</script>
</body>
</html>
